<div
  class="card w-full flex flex-col justify-evenly gap-4 hover:bg-gray-100 text-sm"
  (click)="toogleAction()"
>
  <div class="flex items-center justify-between p-2 gap-2">
    <div class="flex gap-2">
      <img
        ngSrc="assets/svg/three-dots-vertical.svg"
        class="h-5 w-5 hover:cursor-pointer"
        width="20"
        height="20"
      />
      <input id="task-{{ task().id }}" type="checkbox" name="task-{{ task().id }}" />
      <p>{{ task().name }}</p>
      <!-- <ul class="flex">
      @for (tag of task().tags; track tag){
      <li>{{ tag }}</li>
      }
    </ul> -->
    </div>
    <div class="flex gap-2">
      <p>{{ task().description }}</p>
    </div>

    <div class="w-1/6 flex justify-end gap-2">
      <p class="w-full text-xs font-semibold p-1">
        D :
        <span class="w-2 h-2 rounded-xl p-1.5" [style.backgroundColor]="task().color">{{
          task().startDate | date: 'd/M/yyyy'
        }}</span>
      </p>
      <p class="w-full text-xs font-semibold p-1">
        F :
        <span class="w-2 h-2 rounded-xl p-1.5" [style.backgroundColor]="task().color">{{
          task().dueDate | date: 'd/M/yyyy'
        }}</span>
      </p>
    </div>

    <div class="w-1/6 flex justify-between gap-2">
      <p class="w-full text-xs font-semibold p-1">
        P :
        <span class="w-2 h-2 rounded-xl p-1.5" [style.backgroundColor]="task().color">{{
          priorityName()
        }}</span>
      </p>
      <p class="w-full text-xs font-semibold p-1">
        S :
        <span class="rounded-xl p-1.5" [style.backgroundColor]="task().color">{{
          statusName()
        }}</span>
      </p>
    </div>

    <div class="flex gap-2">
      <img
        (click)="editTask(task().id)"
        ngSrc="assets/svg/edit.svg"
        class="h-5 w-5 hover:cursor-pointer"
        alt="supprimer"
        width="20"
        height="20"
      />
      <img
        (click)="deleteTask(task().id)"
        ngSrc="assets/svg/trash.svg"
        class="h-5 w-5 hover:cursor-pointer"
        alt="supprimer"
        width="20"
        height="20"
      />
      <img
        (click)="toogleAction()"
        ngSrc="assets/svg/chevron-right.svg"
        class="h-5 w-5 rotate-90 hover:cursor-pointer"
        width="20"
        height="20"
      />
    </div>
    <!-- <ul class="w-full flex flex-col justify-between gap-2">
      @for (task of task()?.parentTask; track $index) {
        <li>
          <app-card-task [task]="task"></app-card-task>
        </li>
      }
    </ul> -->
  </div>
  @if (isOpen()) {
    <div class="flex items-center justify-between p-2 gap-2">data</div>
  }
</div>
