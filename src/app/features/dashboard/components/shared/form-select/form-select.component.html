<div class="form-group">
  @if (label()) {
    <label
      >{{ label() }}
      @if (required()) {
        <span class="required">*</span>
      }
    </label>
  }

  <select
    [value]="value()"
    [disabled]="isDisabled()"
    (change)="handleSelect($event)"
    (blur)="onTouched()"
    [class.error]="hasError()"
  >
    @if (placeholder()) {
      <option value="" disabled [selected]="!value()">{{ placeholder() }}</option>
    }

    @for (option of options(); track $index) {
      <option
        [value]="option.name ?? option.label ?? option.id ?? option.value"
        [selected]="(option.name ?? option.label ?? option.id ?? option.value) === value()"
      >
        {{ option.name ?? option.label }}
      </option>
    }
  </select>

  @if (hasError()) {
    <div class="error-message">Ce choix est requis.</div>
  }
</div>
