<div class="form-group">
  @if (label()) {
    <label
      >{{ label() }}
      @if (required()) {
        *
      }
    </label>
  }

  <select
    [value]="value()"
    [disabled]="isDisabled()"
    (change)="handleSelect($event)"
    (blur)="onTouched()"
    [class.is-invalid]="hasError()"
  >
    @if (placeholder()) {
      <option value="" disabled selected>{{ placeholder() }}</option>
    }

    @for (option of options(); track option.id || option.value) {
      <option [value]="option.id || option.value">
        {{ option.name || option.label }}
      </option>
    }
  </select>

  @if (hasError()) {
    <div class="error-msg">Ce choix est requis.</div>
  }
</div>
