  <div class="flex items-center justify-between text-sm font-medium">
    <h3 class="text-gray-600 font-medium mb-1">
      {{ progress()?.title }}
    </h3>
    <div>
      <span class="text-gray-600">{{ progress()?.current }}</span>
      <span class="text-gray-400">/{{ progress()?.target }}</span>
    </div>
  </div>

  <div class="mb-1">
    <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
      <div
        [ngClass]="getProgressColor(progress()?.color || '')"
        [style.width.%]="progress()?.progress"
        class="h-1.5 rounded-full transition-all duration-500"
      ></div>
    </div>
  </div>
</div>
