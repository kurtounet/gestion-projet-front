<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-4 max-w-md border-2 border-gray-200 p-4 rounded-lg shadow-sm"
>
  <h1 class="text-xl font-bold">Template de Sprint</h1>

  <form-input-component
    label="Nom"
    formControlName="name"
    placeholder="Nom du sprint"
    [required]="true"
  />

  <form-textarea-component
    label="Description"
    formControlName="description"
    placeholder="Description du sprint..."
    [rows]="3"
    [required]="true"
  />

  <form-input-component
    label="Durée (en jours)"
    formControlName="duration"
    type="number"
    placeholder="Ex: 14"
    [required]="true"
  />

  <div class="grid grid-cols-2 gap-4">
    <form-input-component
      label="Date de création"
      formControlName="createdAt"
      type="datetime-local"
      [required]="true"
    />
    <form-input-component
      label="Date de modification"
      formControlName="updatedAt"
      type="datetime-local"
      [required]="true"
    />
  </div>

  @if (submitted() && form.invalid) {
    <p class="text-sm text-red-600 font-medium">Certains champs sont invalides.</p>
  }

  <button
    type="submit"
    class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors"
  >
    {{ isNew() ? 'Ajouter' : 'Modifier' }}
  </button>
</form>
