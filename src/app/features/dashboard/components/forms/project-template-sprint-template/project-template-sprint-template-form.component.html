<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 max-w-md border-2 border-gray-200 p-4 rounded-lg shadow-sm">
  <h1 class="text-xl font-bold">Liaison Template Projet/Sprint</h1>

  <form-select-component
    label="Template Projet"
    formControlName="projectTemplateId"
    [options]="projectTemplateOptions()"
    [required]="true"
  />

  <form-select-component
    label="Template Sprint"
    formControlName="sprintTemplateId"
    [options]="sprintTemplateOptions()"
    [required]="true"
  />

  <form-input-component
    label="Ordre du Sprint"
    formControlName="sprintOrder"
    type="number"
    placeholder="Position du sprint dans le projet"
    [required]="true"
  />

  <div class="grid grid-cols-2 gap-4">
    <form-input-component
      label="Date de création"
      formControlName="createdAt"
      type="datetime-local"
      [required]="true"
    />
    <form-input-component
      label="Date de modification"
      formControlName="updatedAt"
      type="datetime-local"
      [required]="true"
    />
  </div>

  @if (submitted() && form.invalid) {
    <p class="text-sm text-red-600 font-medium">Certains champs sont invalides.</p>
  }

  <button type="submit" class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors">
    {{ isNew() ? 'Lier' : 'Modifier' }}
  </button>
</form>
