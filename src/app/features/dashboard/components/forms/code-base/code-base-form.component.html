<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-4 max-w-md border-2 border-gray-200 p-4 rounded-lg shadow-sm"
>
  <h1 class="text-xl font-bold">CodeBase</h1>

  <form-input-component
    label="Libellé"
    formControlName="label"
    placeholder="Nom du fichier/module"
    [required]="true"
  />

  <form-input-component label="Code" formControlName="code" placeholder="Identifiant de code" />

  <form-file-picker-component
    label="Fichier"
    formControlName="pathFile"
    placeholder="Choisir le fichier source"
    [required]="true"
  />

  <form-input-component
    label="Fonctionnalité (Feature)"
    formControlName="feature"
    placeholder="Feature associée"
    [required]="true"
  />

  @if (submitted() && form.invalid) {
    <p class="text-sm text-red-600 font-medium">Certains champs sont invalides.</p>
  }

  <button
    type="submit"
    class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors"
  >
    {{ isNew() ? 'Ajouter' : 'Modifier' }}
  </button>
</form>
