<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-4 max-w-md border-2 border-gray-200 p-4 rounded-lg shadow-sm"
>
  <h1 class="text-xl font-bold">Notification</h1>

  <form-select-component
    label="Utilisateur"
    formControlName="userId"
    [options]="userOptions()"
    placeholder="Destinataire"
    [required]="true"
  />

  <form-textarea-component
    label="Message"
    formControlName="message"
    placeholder="Contenu de la notification..."
    [rows]="3"
    [required]="true"
  />

  <form-input-component
    label="Type"
    formControlName="type"
    placeholder="ex: INFO, WARNING, SUCCESS"
    [required]="true"
  />

  @if (submitted() && form.invalid) {
    <p class="text-sm text-red-600 font-medium">Certains champs sont invalides.</p>
  }

  <button
    type="submit"
    class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors"
  >
    {{ isNew() ? 'Envoyer' : 'Modifier' }}
  </button>
</form>
