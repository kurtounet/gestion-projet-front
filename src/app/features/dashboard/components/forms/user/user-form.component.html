<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 max-w-md border-2 border-gray-200 p-4 rounded-lg shadow-sm">
  <h1 class="text-xl font-bold">Utilisateur</h1>

  <div class="grid grid-cols-2 gap-4">
    <form-input-component
      label="Prénom"
      formControlName="firstName"
      placeholder="Prénom"
      [required]="true"
    />
    <form-input-component
      label="Nom"
      formControlName="lastName"
      placeholder="Nom"
      [required]="true"
    />
  </div>

  <form-input-component
    label="Email"
    type="email"
    formControlName="email"
    placeholder="votre.email@domaine.com"
    [required]="true"
  />

  <form-input-component
    label="Mot de passe"
    type="password"
    formControlName="password"
    placeholder="••••••••"
    [required]="true"
  />

  <form-select-component
    label="Rôle"
    formControlName="role"
    [options]="roleOptions()"
    placeholder="Choisir un rôle"
    [required]="true"
  />

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <form-input-component
      label="Créé le"
      formControlName="createdAt"
      type="datetime-local"
      [required]="true"
    />
    <form-input-component
      label="Mis à jour le"
      formControlName="updatedAt"
      type="datetime-local"
      [required]="true"
    />
  </div>

  @if (submitted() && form.invalid) {
    <p class="text-sm text-red-600 font-medium">Certains champs sont invalides.</p>
  }

  <button type="submit" class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors">
    {{ isNew() ? 'Créer le compte' : 'Modifier' }}
  </button>
</form>
