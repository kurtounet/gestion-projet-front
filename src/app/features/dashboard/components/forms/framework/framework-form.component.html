<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-4 max-w-md border-2 border-gray-200 p-4 rounded-lg shadow-sm"
>
  <h1 class="text-xl font-bold">Framework</h1>

  <div class="grid grid-cols-2 gap-4">
    <form-input-component
      label="Nom"
      formControlName="label"
      placeholder="Nom du framework"
      [required]="true"
    />
    <form-input-component
      label="Version"
      formControlName="version"
      placeholder="ex: 17.0.0"
      [required]="true"
    />
  </div>

  <form-textarea-component
    label="Description"
    formControlName="description"
    placeholder="Brève description..."
    [rows]="3"
  />

  <form-select-component
    label="Technologie"
    formControlName="technology"
    [options]="technologyOptions()"
    placeholder="Choisir une technologie"
  />

  <form-textarea-component
    label="Configuration"
    formControlName="configuration"
    placeholder="JSON de configuration..."
    [rows]="4"
  />

  @if (submitted() && form.invalid) {
    <p class="text-sm text-red-600 font-medium">Certains champs sont invalides.</p>
  }

  <button
    type="submit"
    class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors"
  >
    {{ isNew() ? 'Ajouter' : 'Modifier' }}
  </button>
</form>
