<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 max-w-md border-2 border-gray-200 p-4 rounded-lg shadow-sm">
  <h1 class="text-xl font-bold">Fichier</h1>

  <form-input-component
    label="Chemin (Path)"
    formControlName="path"
    placeholder="ex: /assets/docs/file.txt"
    [required]="true"
  />

  <form-input-component
    label="Mot-clé"
    formControlName="keyWord"
    placeholder="Mots-clés pour la recherche"
  />

  @if (submitted() && form.invalid) {
    <p class="text-sm text-red-600 font-medium">Certains champs sont invalides.</p>
  }

  <button type="submit" class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors">
    {{ isNew() ? 'Ajouter' : 'Modifier' }}
  </button>
</form>
