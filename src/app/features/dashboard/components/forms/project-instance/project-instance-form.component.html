<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="w-full flex flex-col gap-4 max-w-md border-2 border-gray-200 p-4 rounded-lg shadow-sm"
>
  <h1 class="text-xl font-bold">Projet</h1>

  <form-input-component
    label="Nom du projet"
    formControlName="name"
    placeholder="Ex: Refonte du site web"
    [required]="true"
    errorMessage="Le nom est requise"
  />

  <form-input-component
    label="Description"
    formControlName="description"
    placeholder="Entrez votre description"
    errorMessage="La description est requise"
  />
  <form-input-component
    label="chemin du Projet"
    formControlName="pathProject"
    placeholder="Entrez le chemin du projet"
    errorMessage="La chemin du projet est requise"
  />
  <form-input-component
    label="Chemin du starUml"
    formControlName="pathFileDatabase"
    placeholder="Entrez votre description"
    errorMessage="La description est requise"
  />
  <form-input-component
    label="couleur"
    formControlName="color"
    placeholder="Entrez votre description"
    errorMessage="La description est requise"
  />
  <form-input-component
    label="Icon"
    formControlName="icon"
    placeholder="Entrez votre description"
    errorMessage="La description est requise"
  />

  <div class="w-full flex gap-4">
    <div class="flex flex-col gap-1 flex-1">
      <label for="startDate" class="font-medium text-sm">Date de début</label>
      <input
        id="startDate"
        type="date"
        formControlName="startDate"
        class="border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
      />
      @if (submitted() && form.controls.startDate.errors) {
        <small class="text-red-500 text-xs">La date de début est requise</small>
      }
    </div>

    <div class="flex flex-col gap-1 flex-1">
      <label for="endDate" class="font-medium text-sm">Date de fin</label>
      <input
        id="endDate"
        type="date"
        formControlName="endDate"
        class="border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
      />
      @if (submitted() && form.controls.endDate.errors) {
        <small class="text-red-500 text-xs">La date de fin est requise</small>
      }
    </div>
  </div>

  <div class="w-full flex gap-4">
    <form-select-component
      label="Statut"
      formControlName="status"
      [options]="statusOptions()"
      placeholder="Choisir un statut"
      class="flex-1"
    />
    <form-select-component
      label="Priorité"
      formControlName="priority"
      [options]="priorityOptions()"
      placeholder="Priorité"
      class="flex-1"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="comment" class="font-medium text-sm">Commentaire</label>
    <textarea
      id="comment"
      formControlName="comment"
      rows="3"
      class="border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
      placeholder="Votre commentaire..."
    ></textarea>
  </div>

  @if (submitted() && form.invalid) {
    <p class="text-sm text-red-600 font-medium">Certains champs sont invalides.</p>
  }

  <button
    type="submit"
    class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors disabled:bg-gray-400"
    [disabled]="submitted() && form.invalid"
  >
    {{ isNew() ? 'Créer le projet' : 'Enregistrer les modifications' }}
  </button>
</form>
