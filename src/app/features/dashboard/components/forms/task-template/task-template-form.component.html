<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-4 max-w-md border-2 border-gray-200 p-4 rounded-lg shadow-sm"
>
  <h1 class="text-xl font-bold">Template de Tâche</h1>

  <form-input-component
    label="Nom"
    formControlName="name"
    placeholder="Nom de la tâche"
    [required]="true"
  />

  <form-textarea-component
    label="Description"
    formControlName="description"
    placeholder="Description..."
    [rows]="3"
    [required]="true"
  />

  <form-select-component
    label="Template Sprint"
    formControlName="sprintTemplateId"
    [options]="sprintTemplateOptions()"
    [required]="true"
  />

  <form-select-component
    label="Type de Tâche"
    formControlName="typeTaskId"
    [options]="typeTaskOptions()"
    [required]="true"
  />

  <form-select-component
    label="Tâche parente"
    formControlName="parentTask"
    [options]="taskTemplateOptions()"
  />

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <form-input-component
      label="Créé le"
      formControlName="createdAt"
      type="datetime-local"
      [required]="true"
    />
    <form-input-component
      label="Mis à jour le"
      formControlName="updatedAt"
      type="datetime-local"
      [required]="true"
    />
  </div>

  @if (submitted() && form.invalid) {
    <p class="text-sm text-red-600 font-medium italic">Certains champs sont invalides.</p>
  }

  <button
    type="submit"
    class="mt-2 px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition-colors"
  >
    {{ isNew() ? 'Ajouter' : 'Modifier' }}
  </button>
</form>
