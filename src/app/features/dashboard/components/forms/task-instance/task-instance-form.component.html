<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 max-w-2xl border-2 border-gray-200 p-6 rounded-xl shadow-md bg-white">
  <h1 class="text-2xl font-bold text-gray-800 mb-2">Instance de Tâche</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="space-y-4">
      <form-input-component
        label="Nom de la tâche"
        formControlName="name"
        placeholder="Nom de la tâche"
        [required]="true"
      />

      <form-select-component
        label="Propriétaire"
        formControlName="user"
        [options]="userOptions()"
        placeholder="Assigner à..."
        [required]="true"
      />

      <form-select-component
        label="Template de Tâche"
        formControlName="taskTemplate"
        [options]="taskTemplateOptions()"
        [required]="true"
      />

      <form-select-component
        label="Instance de Sprint"
        formControlName="sprintInstance"
        [options]="sprintInstanceOptions()"
        [required]="true"
      />
    </div>

    <div class="space-y-4">
      <form-select-component
        label="Priorité"
        formControlName="priority"
        [options]="priorityOptions()"
        [required]="true"
      />

      <form-select-component
        label="Statut"
        formControlName="status"
        [options]="statusOptions()"
        [required]="true"
      />

      <form-select-component
        label="Type de Tâche"
        formControlName="typeTask"
        [options]="typeTaskOptions()"
        [required]="true"
      />

      <div class="grid grid-cols-2 gap-4">
        <form-input-component
          label="Début"
          type="date"
          formControlName="startDate"
          [required]="true"
        />
        <form-input-component
          label="Échéance"
          type="date"
          formControlName="dueDate"
          [required]="true"
        />
      </div>
    </div>
  </div>

  <form-textarea-component
    label="Description"
    formControlName="description"
    placeholder="Décrivez la tâche..."
    [rows]="3"
    [required]="true"
  />

  <form-select-component
    label="Commentaire associé"
    formControlName="comment"
    [options]="commentOptions()"
  />

  @if (submitted() && form.invalid) {
    <div class="p-3 bg-red-50 border border-red-200 rounded-lg">
      <p class="text-sm text-red-600 font-semibold text-center italic">Le formulaire contient des erreurs. Veuillez vérifier les champs requis.</p>
    </div>
  }

  <div class="flex justify-end mt-4">
    <button type="submit" class="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg">
      {{ isNew() ? 'Créer la tâche' : 'Modifier la tâche' }}
    </button>
  </div>
</form>
