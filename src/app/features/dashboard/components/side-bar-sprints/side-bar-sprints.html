<div class="flex">
  <h3 class="text-sm font-medium text-gray-500 px-3 mt-0 mb-2">Sprints</h3>
  @if (orderSprint() === 'asc') {
    <h3 class="text-sm font-medium text-gray-500 px-3 mt-0 mb-2" (click)="toggleSort()">ASC</h3>
  } @else {
    <h3 class="text-sm font-medium text-gray-500 px-3 mt-0 mb-2" (click)="toggleSort()">DESC</h3>
  }
</div>
<div
  cdkDropList
  [cdkDropListData]="items()"
  cdkDropListOrientation="vertical"
  class="w-[255px] flex flex-col mt-0 mr-1"
  (cdkDropListDropped)="drop($event)"
>
  @if (items().length > 0) {
    <ul class="sprints-container flex flex-col gap-1">
      @for (sprint of items(); track sprint.name) {
        <li (click)="selectedSprint(sprint)" cdkDrag>
          <app-side-bar-card-sprint [sprint]="sprint" />
        </li>
      }
    </ul>
  }
</div>
