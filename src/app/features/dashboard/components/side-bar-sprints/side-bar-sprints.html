<div
  cdkDropList
  [cdkDropListData]="items()"
  cdkDropListOrientation="vertical"
  class="w-[255px] flex flex-col mt-0 mr-1"
  (cdkDropListDropped)="drop($event)"
>
  @if (items().length > 0) {
    <ul class="sprints-container flex flex-col gap-1">
      @for (sprint of items(); track sprint.id) {
        <li (click)="selectedSprint(sprint)" cdkDrag>
          <app-side-bar-card-sprint [sprint]="sprint" />
        </li>
      }
    </ul>
  }
</div>
