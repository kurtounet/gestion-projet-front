<section class="w-full p-8 flex flex-col items-center">
  <div>
    <h1 class="text-3xl font-bold">Listes de projets</h1>
  </div>
  <div
    class="w-full"
    cdkDropList
    [cdkDropListData]="items()"
    cdkDropListOrientation="vertical"
    (cdkDropListDropped)="drop($event)"
  >
    <ul>
      @if (projectInstanceStore.projectsLoading()) {
        <p>Chargement…</p>
      } @else if (projectInstanceStore.projectsLoaded()) {
        @for (project of items(); track project.id) {
          <li cdkDrag>
            <app-card-project [project]="project" />
          </li>
        }
      } @else {
        <p>Aucune donnée</p>
      }
    </ul>
  </div>
</section>
