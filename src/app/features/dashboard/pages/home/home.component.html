<section class="page-wrapper">
  <section>
    <h1 class="text-3xl font-bold mb-4">Tableau de bord</h1>
    <app-panel-statistic />
  </section>
  <section class="card">
    <div class="flex items-center justify-between">
      <h1 class="text-3xl font-bold">Listes de projets</h1>
      <button
        class="bg-blue-500 text-white px-4 py-2 hover:bg-blue-600 hover:cursor-pointer"
        [routerLink]="['/admin/project/create']"
      >
        Ajouter un projet
      </button>
    </div>
    <ul class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      @for (project of projects(); track $index) {
        <app-card-project [project]="project"></app-card-project>
      }
    </ul>
  </section>
</section>
